name: Build Pramanik Bari Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Environment Files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
            echo "Copied .env.example to .env"
          fi

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64"
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore ./debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug.keystore"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/PramanikBari.apk
          echo "APK prepared at output_apk/PramanikBari.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PramanikBari-APK
          path: output_apk/PramanikBari.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Pramanik Bari App v1.0' }}
          body: |
            ### Pramanik Bari - Digital Family Tree & Events Management
            প্রামাণিক বাড়ি ডিজিটাল বংশলতিকা ও পারিবারিক স্মৃতি অ্যালবাম অ্যাপ।

            **Download & Install Instructions:**
            1. Download the `PramanikBari.apk` file below directly to your Android device.
            2. Tap the downloaded APK to install.
            3. If prompted, allow "Install from Unknown Sources" in your browser or file manager settings.
            4. Open the app and enjoy the interactive family tree, genealogy lineage, and reunion photo albums!
          files: output_apk/PramanikBari.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
